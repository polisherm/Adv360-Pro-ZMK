name: Draw keymaps

on:
  push:
    paths:
      - 'config/adv360.keymap'
      - 'config/adv360.json'
      - 'config/macros.dtsi'
      - 'keymap-drawer/keymap_drawer.config.yaml'
      - 'keymap-drawer/keymap_drawer.config.dark.yaml'
      - '.github/workflows/draw-keymaps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install keymap-drawer and west
        run: pip install keymap-drawer west

      - name: West init and update (fetch ZMK headers for keymap preprocessing)
        run: |
          west init -l config
          west config --local manifest.project-filter " -zephyr"
          west update --fetch-opt=--filter=tree:0

      - name: Parse keymap
        run: |
          keymap -c keymap-drawer/keymap_drawer.config.yaml parse -c 10 -z config/adv360.keymap > keymap-drawer/adv360.yaml

      - name: Draw light SVG
        run: |
          keymap -c keymap-drawer/keymap_drawer.config.yaml draw keymap-drawer/adv360.yaml > keymap-drawer/adv360-light.svg

      - name: Draw dark SVG
        run: |
          keymap -c keymap-drawer/keymap_drawer.config.dark.yaml draw keymap-drawer/adv360.yaml > keymap-drawer/adv360-dark.svg

      - name: Remove obsolete single-theme SVG
        run: |
          rm -f keymap-drawer/adv360.svg

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'keymap-drawer render'
          file_pattern: 'keymap-drawer/*.svg keymap-drawer/*.yaml'
